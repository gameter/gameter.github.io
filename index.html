<!DOCTYPE html>

  <meta name="naver-site-verification" content="034fb87e498c0d754ab61068392cff7d0b2bef69" />

  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif; background-color: #f4f4f4; }
    .seo-wrap { display: flex; justify-content: center; }
    #seo-content {
      width: 100%;
      max-width: 1360px;
      box-sizing: border-box;
      background-image: url('https://i.ibb.co/DPpRw5CZ/image.png');
      background-size: cover;
      background-position: center;
      padding: 40px 24px;
      text-align: left;
    }
    @media screen and (min-width: 640px) {
      #seo-content {
        width: calc(90% - 40px);
        box-shadow: 0 0 30px rgba(0,0,0,0.15);
        border-radius: 8px;
        margin-top: 20px;
        padding: 40px;
      }
    }
    #seo-content .seo-brand {
      color: #2e7d32;
      font-weight: 800;
      font-size: 26px;

    }
    #seo-content h1 {

      font-size: 30px;
      font-weight: 800;
      margin: 0 0 12px;
      line-height: 1.4;
    }
    #seo-content h1 span { color: #2e7d32; }
    #seo-content .seo-sub {
      color: #444;
      font-size: 14px;
      margin: 0 0 26px;
      line-height: 1.7;
      max-width: 640px;
    }
    .seo-cards {
      display: flex;
      flex-wrap: wrap;
      gap: 26px;
      padding-top: 20px;
      border-top: 1px solid rgba(0,0,0,0.08);
    }
    .seo-card {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .seo-card .icon {
      width: 38px; height: 38px; flex-shrink: 0;
      background: #ffffff;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .seo-card .text-group { text-align: left; }
    .seo-card .title { color: #222; font-weight: bold; font-size: 14px; }
    .seo-card .desc { color: #555; font-size: 13px; }

    @media screen and (min-width: 1024px) {
      #seo-content .seo-brand { font-size: 30px; }
      #seo-content h1 { font-size: 36px; }
      #seo-content .seo-sub { font-size: 15px; }
      .seo-card .title { font-size: 15px; }
      .seo-card .desc { font-size: 14px; }

<body>

  
<body>
  <div class="seo-wrap">
    <div id="seo-content">
      <div class="seo-brand">릴케어팜</div>
      <h1>먼저, <span>내 릴 시세</span>를 알아볼까요?</h1>
      <p class="seo-sub">중고 낚시릴 시세조회부터 위탁판매까지 한 번에 해결하는 중고 릴 전문 플랫폼. 시마노, 다이와 등 인기 브랜드 스피닝릴·베이트릴의 중고 시세를 무료로 조회하고, 검수부터 판매·정산까지 릴케어팜에 간편하게 맡겨보세요.</p>
      <div class="seo-cards">
        <div class="seo-card">
          <div class="icon">📈</div>
          <div class="text-group">
            <div class="title">실거래 기반</div>
            <div class="desc">정확한 시세</div>
          </div>
        </div>
        <div class="seo-card">
          <div class="icon">🚚</div>
          <div class="text-group">
            <div class="title">홈택배</div>
            <div class="desc">편리한 방문 수거</div>
          </div>
        </div>
        <div class="seo-card">
          <div class="icon">🛡️</div>
          <div class="text-group">
            <div class="title">전문가 검수로</div>
            <div class="desc">믿을 수 있는 거래</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <iframe id="app-frame" style="width:100vw; height:100vh; border:none;"></iframe>
